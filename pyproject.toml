[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "tn_noise_learning"
version = "0.1.0"
authors = [
  { name = "Algorithmiq", email = "noise-learning@algorithmiq.fi" },
]
description = "Tensor-network learning of quantum noise channels (LPDO + MPO + JAX) for QPT."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0,<2.4",
  "scipy>=1.13",
  "quimb>=1.11",
  "autoray>=0.6",
  "cotengra>=0.7",
  "jax>=0.9,<0.10",
  "jaxlib>=0.9,<0.10",
  "optax>=0.2.8",
  "qiskit>=2.2,<3",
  "joblib>=1.3",
  "tqdm>=4.65",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.urls]
Repository = "https://github.com/Algorithmiq/tn-noise-learning"

[dependency-groups]
test = [
  "pytest>=8.2",
  "pytest-cases>=3.6",
  "hypothesis[numpy]>=6.100",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  { include-group = "test" },
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mkdocs-jupyter>=0.24",
]


[tool.hatch.build.targets.wheel]
packages = ["src/tn_noise_learning"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: mark test as slow (>=1 minute runtime)"]
filterwarnings = [
  "ignore::DeprecationWarning:numpy.ctypeslib",
  "ignore::UserWarning:quimb.core",
]


[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["docs", "examples"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
extend-select = [
  "E", "W", "F",     # pyflakes / pycodestyle
  "I",                # isort
  "N",                # pep8-naming
  "D",                # pydocstyle
  "ANN",              # flake8-annotations
  "UP",               # pyupgrade
  "B",                # flake8-bugbear
  "SIM",              # flake8-simplify
  "NPY",              # NumPy-specific
  "PT",               # pytest-style
  "RET",              # flake8-return
  "TID",              # tidy imports
]
ignore = [
  "D203",             # one-blank-line-before-class (conflicts with D211)
  "D213",             # multi-line-summary-second-line (conflicts with D212)
  "N803",             # arg name should be lowercase (quantum code uses N, K, U)
  "N806",             # variable in function should be lowercase
  "ANN401",           # Any in type hints is allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]
"src/tn_noise_learning/**/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]


[tool.mypy]
python_version = "3.12"
files = ["src/tn_noise_learning"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false   # follow-up milestone: turn on
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
