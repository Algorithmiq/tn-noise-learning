[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "tn_noise_learning"
version = "0.2.0"
authors = [
  { name = "Algorithmiq", email = "noise-learning@algorithmiq.fi" },
]
description = "Tensor-network learning of quantum noise channels: LPDO models on 1D, 2D and custom topologies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0,<2.4",
  "quimb>=1.11",
  "autoray>=0.6",
  "cotengra>=0.8.2",
  "jax>=0.9,<0.10",
  "jaxlib>=0.9,<0.10",
  "optax>=0.2.8",
  "qiskit>=2.2,<3",
  "zarr>=3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Algorithmiq/TensorNetworksNoiseLearning"

[dependency-groups]
test = [
  "pytest>=8.2",
  "pytest-cov>=5",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  { include-group = "test" },
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
]


[tool.hatch.build.targets.wheel]
packages = ["src/tn_noise_learning"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = ["slow: mark test as slow (>= 10 s runtime)"]
filterwarnings = [
  "ignore:Couldn't import `kahypar`:UserWarning",
  "ignore::DeprecationWarning:numpy.ctypeslib",
]


[tool.coverage.run]
branch = true
source = ["src/tn_noise_learning"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise ImportError"]


[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["docs"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",       # docstring style choices that conflict with D211 / D212
  "D107",               # __init__ docstrings: the class docstring documents the arguments
  "COM812", "ISC001",   # handled by the formatter
  "ANN401",             # Any is allowed where quimb/optax types are untyped
  "N803", "N806",       # uppercase quantum identifiers (K, V, U)
  "PLR0913",            # configs and constructors take many arguments
  "PLR2004",            # 2, 4 and 16 are the physics, not magic numbers
  "EM101", "EM102", "TRY003",  # f-string exception messages
  "FBT001", "FBT002",   # boolean flags such as shuffle=True
  "RUF001", "RUF002", "RUF003",  # unicode math (Λ, ‖·‖, →) in docstrings and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "INP001", "PLR0913", "PT011", "SLF001", "E731", "ARG"]
"examples/**" = ["T201", "INP001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]


[tool.mypy]
python_version = "3.12"
files = ["src/tn_noise_learning"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
