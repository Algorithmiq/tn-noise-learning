[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"


[project]
name = "tn-noise-learning"
dynamic = ["version"]
authors = [
  { name = "Algorithmiq Development Team", email = "info@algorithmiq.fi" },
]
description = "Tensor-network learning of quantum noise channels: LPDO models on 1D, 2D and custom topologies."
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0,<2.6",
  "quimb>=1.11",
  "autoray>=0.6",
  "cotengra>=0.8.2",
  "jax>=0.9,<0.13",
  "jaxlib>=0.9,<0.13",
  "optax>=0.2.8",
  "qiskit>=2.2,<3",
  "zarr>=3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://algorithmiq.github.io/tn-noise-learning/"
Documentation = "https://algorithmiq.github.io/tn-noise-learning/"
Repository = "https://github.com/Algorithmiq/tn-noise-learning"
"Bug Tracker" = "https://github.com/Algorithmiq/tn-noise-learning/issues"
Discussions = "https://github.com/Algorithmiq/tn-noise-learning/discussions"
Changelog = "https://github.com/Algorithmiq/tn-noise-learning/releases"

[dependency-groups]
test = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "pytest-markdown-docs>=0.9",
]
dev = [
  "prek>=0.5",
  "ruff==0.17.1",
  "ty==0.0.89",
  { include-group = "test" },
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
]


[tool.uv]
python-preference = "only-managed"
# re-read the version from git when a commit or tag changes
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tn_noise_learning/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tn_noise_learning"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".devcontainer", ".envrc", ".github", ".lychee.toml", ".vscode", "AGENTS.md", "CLAUDE.md", "codecov.yml",
  "cspell.json", "flake.lock", "flake.nix", "justfile", "nix", "plans", "prek.toml", "sonar-project.properties",
  "tools",
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-ra", "--showlocals", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
markers = ["slow: mark test as slow (>= 10 s runtime)"]
required_plugins = ["pytest-cov", "pytest-markdown-docs"]
filterwarnings = [
  "error",
  "ignore:Couldn't import `kahypar`:UserWarning",
  "ignore::DeprecationWarning:numpy.ctypeslib",
  # cotengra's auto-hq path search forks a process pool inside multithreaded JAX (deadlock risk on Linux, Python < 3.14); to be tracked in an issue
  "ignore:os.fork\\(\\) was called:RuntimeWarning",
  # quimb's L-BFGS-B wrapper assigns ndarray.shape, deprecated in NumPy 2.5
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:quimb",
]


[tool.coverage.run]
branch = true
source = ["src/tn_noise_learning"]
relative_files = true
omit = ["src/tn_noise_learning/_version.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise ImportError"]


[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["docs", "src/tn_noise_learning/_version.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",       # docstring style choices that conflict with D211 / D212
  "D107",               # __init__ docstrings: the class docstring documents the arguments
  "COM812", "ISC001",   # handled by the formatter
  "ANN401",             # Any is allowed where quimb/optax types are untyped
  "N803", "N806",       # uppercase quantum identifiers (K, V, U)
  "PLR0913",            # configs and constructors take many arguments
  "PLR2004",            # 2, 4 and 16 are the physics, not magic numbers
  "EM101", "EM102", "TRY003",  # f-string exception messages
  "FBT001", "FBT002",   # boolean flags such as shuffle=True
  "RUF001", "RUF002", "RUF003",  # unicode math (Λ, ‖·‖, →) in docstrings and comments
]
# do not autofix these: the fix deletes code
unfixable = ["ERA", "F401", "F841", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "INP001", "PLR0913", "PT011", "SLF001", "E731", "ARG"]
"examples/**" = ["T201", "INP001", "D"]
"tools/**" = ["INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]


[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests/conftest.py", "examples", "docs/gen_ref_pages.py", "tools"]
