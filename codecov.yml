# Docs: https://docs.codecov.com/docs/codecov-yaml
#
# One coverage.py XML per commit from qa-analysis.yml; test results from every test.yml leg.

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Informational so a dip never blocks a PR while the coverage setup is still
    # stabilising; flip to a real threshold once the baseline on `main` is trusted.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# `require_base: false` lets the PR comment appear even before `main` has an
# uploaded baseline to diff against.
comment:
  layout: "condensed_header, diff, flags, components, condensed_files"
  behavior: default
  require_base: false
  require_head: true

# Wait for every expected upload before finalising, so the merged report is not
# computed from a partial set of the matrix legs.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
