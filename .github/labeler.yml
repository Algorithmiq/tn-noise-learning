python:
  - changed-files:
    - any-glob-to-any-file: ["src/**", "tests/**", "examples/**", "*.py"]
documentation:
  - changed-files:
    - any-glob-to-any-file: ["docs/**", "*.md", "mkdocs.yml"]
ci:
  - changed-files:
    - any-glob-to-any-file: [".github/**", "justfile", "prek.toml"]
dependencies:
  - changed-files:
    - any-glob-to-any-file: ["pyproject.toml", "uv.lock", ".github/dependabot.yml"]
tools:
  - changed-files:
    - any-glob-to-any-file: ["tools/**"]
nix:
  - changed-files:
    - any-glob-to-any-file: ["flake.nix", "flake.lock", "nix/**", ".envrc"]
devcontainer:
  - changed-files:
    - any-glob-to-any-file: [".devcontainer/**", ".vscode/**"]
