name: Publish tn-noise-learning to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs reads the tags

      - name: Set up the build environment
        uses: ./.github/actions/setup

      - name: Build distributions
        run: just dist

      - name: Check the version matches the release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheels=(dist/*.whl)
          actual="$(basename "${wheels[0]}" | cut -d- -f2)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::built version is '$actual', but the release tag is '$expected'"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

  upload_pypi:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  upload_release_assets:
    name: Attach the distributions to the GitHub release
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Upload to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
