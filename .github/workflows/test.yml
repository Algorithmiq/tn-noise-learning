name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 3
  COLUMNS: 120

jobs:
  package-tests:
    name: Test ${{ matrix.runner }} py${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        python-version: ["3.12", "3.15"]

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: just build

      - name: Run tests
        run: just test-ci "${{ matrix.runner }}-${{ matrix.python-version }}"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ matrix.runner }}-${{ matrix.python-version }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false

  tests:
    name: All tests
    if: always()
    needs: package-tests
    runs-on: ubuntu-slim

    steps:
      - name: Report the matrix result
        run: |
          echo "package-tests: ${{ needs.package-tests.result }}"
          case "${{ needs.package-tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
