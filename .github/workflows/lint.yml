name: Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # the PR's history, so prek can run on a commit range
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup

      # ty resolves imports against the project environment
      - name: Install package
        run: just build

      - name: Run prek
        uses: j178/prek-action@v3.0.2
        env:
          RUFF_OUTPUT_FORMAT: github
          TY_OUTPUT_FORMAT: github
        with:
          extra-args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}
